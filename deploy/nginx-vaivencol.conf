# /etc/nginx/sites-available/vaivencol.com
# After DNS propagates, run: sudo certbot --nginx -d vaivencol.com -d www.vaivencol.com
server {
    # default_server: also answers requests by IP (190.216.198.158) until DNS is ready
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vaivencol.com www.vaivencol.com _;

    client_max_body_size 10M;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
